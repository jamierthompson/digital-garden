name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # Sanity project ID and dataset are public (shipped to the browser), not secrets.
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: va1axyj4
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm lint:color
      - run: pnpm lint:icon
      - run: pnpm lint:dimension
      - run: pnpm lint:routes
      - run: pnpm lint:keys
      - run: pnpm lint:docs
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # Regenerate Sanity types from the studio schema and fail if they drift.
      - run: pnpm --filter studio typegen
      - run: git diff --exit-code sanity.types.ts

      - run: pnpm build

  # Published-Sanity-keys -> code drift net (issue #39). Separate from `verify` because it
  # hits the network — the blocking local gate stays offline-safe. The script itself
  # degrades gracefully (SKIP, exit 0) on a network/config problem and only exits 1 on a
  # genuine published key with no code resolver, so this job still fails the PR on real
  # drift.
  published-keys:
    runs-on: ubuntu-latest
    # Sanity project ID and dataset are public (shipped to the browser), not secrets.
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: va1axyj4
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:keys:published
